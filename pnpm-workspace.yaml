# Antigüedad mínima de publicación, en minutos (7 días): pnpm no instala versiones más nuevas.
# Renovate aplica la misma regla (renovate.json).
minimumReleaseAge: 10080

# fast-uri llega vía @hookform/resolvers > ajv. El mínimo ^3.1.9 cierra GHSA-xhq7-xmqj-769h y
# GHSA-333x-w4r6-6crp; se queda en la 3.x mientras ajv la use (renovate.json ignora la mayor).
overrides:
  fast-uri: '^3.1.9'

# Únicos paquetes autorizados a ejecutar scripts de instalación.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
