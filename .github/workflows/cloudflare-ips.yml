name: Firewall con los rangos de Cloudflare

# Una vez al mes, actualiza la regla de firewall de Google Cloud que deja entrar al puerto 443 solo desde
# Cloudflare (especificación 12.6). Corre aquí y no en la VM: la cuenta de servicio de la VM solo accede al
# bucket de respaldos (mínimo privilegio). Usa una cuenta de servicio aparte, con un rol propio que solo
# permite leer y actualizar reglas de firewall (docs/despliegue.md). Sin las variables, no hace nada.
on:
  schedule:
    - cron: '17 9 3 * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  firewall:
    name: Actualizar cachorros-https-cloudflare
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_FIREWALL_SA != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Rangos IPv4 vigentes de Cloudflare
        id: ranges
        run: |
          ranges=$(curl -fsS --max-time 20 https://www.cloudflare.com/ips-v4 | tr -d '\r' | sed '/^$/d')
          if printf '%s\n' "$ranges" | grep -Evq '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'; then
            echo 'La lista de Cloudflare trae algo que no es un rango IPv4: no se cambia nada.' >&2
            exit 1
          fi
          (( $(printf '%s\n' "$ranges" | wc -l) >= 10 )) || { echo 'Lista demasiado corta: no se cambia nada.' >&2; exit 1; }
          echo "csv=$(printf '%s\n' "$ranges" | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREWALL_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Actualizar la regla si cambió
        env:
          RANGES: ${{ steps.ranges.outputs.csv }}
        run: |
          current=$(gcloud compute firewall-rules describe cachorros-https-cloudflare \
            --project "${{ vars.GCP_PROJECT }}" --format='value(sourceRanges.list(separator=","))')
          sorted() { tr ',' '\n' | sort | paste -sd, -; }
          if [[ "$(sorted <<<"$current")" == "$(sorted <<<"$RANGES")" ]]; then
            echo 'Los rangos no cambiaron.'
            exit 0
          fi
          gcloud compute firewall-rules update cachorros-https-cloudflare \
            --project "${{ vars.GCP_PROJECT }}" --source-ranges="$RANGES"
          echo 'Regla actualizada. En la VM, ./deploy/cloudflare-ips.sh actualiza Caddy (cron mensual).' >> "$GITHUB_STEP_SUMMARY"
