name: Publicar imágenes

# Cada push a main publica cachorros-web y cachorros-ops en GHCR (especificación 12.5), con las etiquetas
# sha-<corto> (la que se despliega) y main. Trivy escanea antes de publicar y falla con CRITICAL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    name: Imagen ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: cachorros-web
            context: .
          - image: cachorros-ops
            context: docker/ops
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Nombre y etiquetas
        id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/${{ matrix.image }}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tags=${name}:sha-${GITHUB_SHA::7},${name}:main" >> "$GITHUB_OUTPUT"
      - name: Construir (sin publicar todavía)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy (falla con CRITICAL)
        run: bash .github/scripts/trivy.sh "${{ steps.meta.outputs.name }}:main"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en GHCR
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Resumen
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "Publicada como \`${{ steps.meta.outputs.name }}:sha-${GITHUB_SHA::7}\` y \`:main\`."
            echo
            echo "Para desplegarla: \`./deploy/deploy.sh sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
