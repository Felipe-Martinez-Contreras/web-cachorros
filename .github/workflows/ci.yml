name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  calidad:
    name: Lint, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod

  build:
    name: Build sin base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sin servicio de PostgreSQL ni variables de entorno: si el build toca la BD, este job falla.
      - run: pnpm build
      - run: pnpm build:scripts

  integracion-y-e2e:
    name: Integración y e2e
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cachorros
          POSTGRES_USER: cachorros_admin
          POSTGRES_PASSWORD: cachorros_admin_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cachorros_admin -d cachorros"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    env:
      SITE_ENV: development
      SITE_URL: http://localhost:3000
      DATABASE_ADMIN_URL: postgres://cachorros_admin:cachorros_admin_ci@localhost:5432/cachorros
      DATABASE_URL: postgres://cachorros_app:cachorros_app_ci@localhost:5432/cachorros
      BETTER_AUTH_SECRET: secreto-solo-para-ci-sin-valor-real-0123456789abcdef
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: Club Deportivo Los Cachorros <no-responder@cachorros.test>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse móvil de la portada (informativo)
    runs-on: ubuntu-latest
    # No bloquea el PR: publica los puntajes para compararlos con la meta (90 / 95 / 95 / 95).
    continue-on-error: true
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cachorros
          POSTGRES_USER: cachorros_admin
          POSTGRES_PASSWORD: cachorros_admin_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cachorros_admin -d cachorros"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SITE_ENV: development
      SITE_URL: http://localhost:3210
      DATABASE_ADMIN_URL: postgres://cachorros_admin:cachorros_admin_ci@localhost:5432/cachorros
      DATABASE_URL: postgres://cachorros_app:cachorros_app_ci@localhost:5432/cachorros
      BETTER_AUTH_SECRET: secreto-solo-para-ci-sin-valor-real-0123456789abcdef
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: Club Deportivo Los Cachorros <no-responder@cachorros.test>
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lighthouse (5 corridas, 4G lento y CPU ×4)
        id: lighthouse
        continue-on-error: true
        run: pnpm lighthouse
      - name: Resumen de puntajes
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 30

  docker:
    name: Imagen Docker (build y arranque)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen (sin base de datos)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cachorros-web:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar junto a PostgreSQL y revisar /api/health
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_DB=cachorros -e POSTGRES_USER=cachorros_admin -e POSTGRES_PASSWORD=cachorros_admin_ci \
            postgres:18-alpine
          cat > ci.env <<'EOF'
          SITE_ENV=staging
          SITE_URL=http://localhost:3000
          APP_VERSION=ci
          DATABASE_ADMIN_URL=postgres://cachorros_admin:cachorros_admin_ci@db:5432/cachorros
          DATABASE_URL=postgres://cachorros_app:cachorros_app_ci@db:5432/cachorros
          BETTER_AUTH_SECRET=secreto-solo-para-ci-sin-valor-real-0123456789abcdef
          SMTP_HOST=localhost
          SMTP_PORT=587
          MAIL_FROM=Club <no-responder@cachorros.test>
          EOF
          for i in $(seq 1 30); do
            docker exec db pg_isready -U cachorros_admin -d cachorros && break
            sleep 2
          done
          docker run --rm --network ci --env-file ci.env cachorros-web:ci node scripts/migrate.mjs
          docker run -d --name app --network ci --env-file ci.env -p 3000:3000 cachorros-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
